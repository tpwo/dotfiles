# When escape-time is high enough, using commands too fast might not be
# recognized by tmux which is very annoying. It can't be too low on *some*
# platforms, as strange characters start appearing
# https://github.com/microsoft/WSL/issues/5931
set -s escape-time 5

# Use prefix + R to refresh config file
bind R source-file ~/.tmux.conf \; display "'~/.tmux.conf' sourced"

# Unbind default prefix key and set it to C-z.
# C-a conflicts with Bash Emacs mode.
unbind C-b
set -g prefix C-z

# Add double-tap prefix key to toggle last window (same as in screen)
bind C-z last-window

# Allows to use C-z z <cmd> to send commands to a nested tmux session
bind a send-prefix


# Open new windows in the same dir as current pane
bind c new-window -c "#{pane_current_path}"

# Split horizontally using | or \ (so no shift needed)
# Also open new pane in the same dir as current pane
unbind |
unbind '\'

bind | split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"

# Split vertically using _ or - (so no shift needed)
# Open new pane in the same dir as current pane
unbind _
bind _ split-window -v -c "#{pane_current_path}"
unbind -
bind - split-window -v -c "#{pane_current_path}"

set -g status-keys emacs   # Emacs mode for commands in : menu
setw -g mode-keys vi       # Vi for copy mode
set -g status-keys vi      # Vi for command status
set -g mouse on            # Allow to use mouse mainly for scrolling
set -g renumber-windows on # Automatically renumber windows when closing

# Easier and faster switching between next/prev window
bind C-p previous-window
bind C-n next-window

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size
# of any client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms
set -g display-time 2000

# Focus events enabled for terminals that support them
set -g focus-events on

# Avoid cursor movement messing with resize
set -g repeat-time 200

# Start indexing from 1 as 0 is too far away
set -g base-index 1
setw -g pane-base-index 1

# Enable true color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# ------------------------------- Style --------------------------------

# Refresh status bar each second
set -g status-interval 5

# Move status bar to top and don't highlight it
set -g status-position top
set -g status-bg default

# Set style of left status box, #S is a current session name
set -g status-left "[#S] "
set -g status-left-length 50
set -g status-left-style "fg=brightblack"

# Display full time in right status and set its style
set -g status-right "#(sysctl -n vm.loadavg | awk '{print $2, $3, $4}') | %d %a, %H:%M"
set -g status-right-length 150
set -g status-right-style "fg=brightblack"

# Set style of currently active window name
set -g window-status-current-style "bg=brightyellow,fg=black"
# Set style of last active window name
set -g window-status-last-style "bg=white,fg=black"
# Set style of remaining windows names (and possibly something else)
set -g status-style "fg=brightblack"

# Set style of pane borders
set -g pane-border-style "fg=brightblue"
set -g pane-active-border-style "fg=brightyellow"

# Set style of highlighted line in window and session summary view
set -g mode-style "bg=brightblack,fg=brightwhite"

# Set style of error messages etc.
set -g message-style "fg=red"

setw -g clock-mode-colour blue

# ------------------------- vim-tmux-navigator -------------------------

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Open tmux-sessionizer for the new repo
bind C-o display-popup -E "tms"

# Open tmux-sessionizer for the switch
bind C-j display-popup -E "tms switch"

# Open tmux-sessionizer for the windows switch
bind C-w display-popup -E "tms windows"

# Bind C-l to switch to last session
bind C-l switch-client -l
# Capital L is the default binding for it, so unbind it
unbind L

# Kill session with tmux-sessionizer and switch to another session
# (plain tmux quits itself in this case)
# Killing session has to be confirmed with lowercase `y`
# Any other input or pressing enter does nothing
bind C-k confirm -p "Kill current session? (y/N):" "run-shell 'tms kill'"
